<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Mamta General Store — brand mark.
       Striped shop awning over an "M" monogram (Mamta). Colors mirror the
       design tokens in src/app/globals.css: ink primary, cream background,
       soft rose. Built for 16 px legibility: bold alternating stripes and a
       chunky rounded M drawn as a path, so no font is embedded or required.
       Four awning teeth (not three) avoid any face-like reading. -->
  <defs>
    <!-- Rounded canopy the stripes are clipped to -->
    <clipPath id="canopy">
      <rect x="88" y="116" width="336" height="112" rx="34"/>
    </clipPath>
  </defs>

  <!-- Ink tile -->
  <rect width="512" height="512" rx="112" fill="#26231F"/>

  <!-- Awning canopy: cream base + rose stripes (classic four-stripe awning) -->
  <g clip-path="url(#canopy)">
    <rect x="88" y="116" width="336" height="112" fill="#F7F3EA"/>
    <rect x="172" y="116" width="84" height="112" fill="#E8B4B0"/>
    <rect x="340" y="116" width="84" height="112" fill="#E8B4B0"/>
  </g>
  <!-- Scalloped bottom edge: one semicircle per stripe, same alternation -->
  <circle cx="130" cy="228" r="42" fill="#F7F3EA"/>
  <circle cx="214" cy="228" r="42" fill="#E8B4B0"/>
  <circle cx="298" cy="228" r="42" fill="#F7F3EA"/>
  <circle cx="382" cy="228" r="42" fill="#E8B4B0"/>

  <!-- M monogram: single rounded stroke, centered under the awning -->
  <path
    d="M156 404 L156 300 L256 378 L356 300 L356 404"
    fill="none"
    stroke="#F7F3EA"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
